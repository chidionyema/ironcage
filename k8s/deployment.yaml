apiVersion: v1
kind: Namespace
metadata:
  name: ironcage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: ironcage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-pvc
  namespace: ironcage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironcage-kernel
  namespace: ironcage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ironcage-kernel
  template:
    metadata:
      labels:
        app: ironcage-kernel
    spec:
      runtimeClassName: gvisor
      containers:
      - name: kernel
        image: ironcage-kernel:latest
        imagePullPolicy: Never
        resources:
          requests:
            memory: "512Mi"
            cpu: "800m"
          limits:
            memory: "1Gi"
            cpu: "1"
        ports:
        - containerPort: 3000
          name: mcts
        volumeMounts:
        - name: models
          mountPath: /models
        - name: ledger
          mountPath: /data
        env:
        - name: RUST_LOG
          value: "info"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
      - name: ledger
        persistentVolumeClaim:
          claimName: ledger-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ironcage-kernel
  namespace: ironcage
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: mcts
  selector:
    app: ironcage-kernel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironcage-api
  namespace: ironcage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ironcage-api
  template:
    metadata:
      labels:
        app: ironcage-api
    spec:
      containers:
      - name: api
        image: ironcage-api:latest
        imagePullPolicy: Never
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1"
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: RUST_LOG
          value: "info"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ironcage-api
  namespace: ironcage
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  selector:
    app: ironcage-api
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
