apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ironcage-research
  description: Production research kernel with MCTS, formal verification, and tamper-evident ledger
  links:
    - url: https://github.com/chidionyema/ironcage
      title: Repository
      icon: github
    - url: http://localhost:3001
      title: Research UI
      icon: dashboard
  tags:
    - research
    - mcts
    - formal-verification
