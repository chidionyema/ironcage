name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run must be startable without inventing a commit. The estate's clusters pull by tag, so a
  # push that fails to publish leaves them with nothing to fetch and no way to retry but an empty
  # commit -- which is what happened on 2026-09-17, and the cluster sat on ImageInspectError for
  # three and a half days.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --lib --verbose
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy -- -D warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Check binary sizes
        run: |
          ls -lh target/release/ironcage-*
          du -sh target/release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A JOB-LEVEL `permissions:` BLOCK REPLACES THE WORKFLOW-LEVEL ONE, it does not merge with it.
    #
    # Measured 2026-09-19: this block listed only `packages: write`, so `contents: read` from the
    # top of the file was dropped, and the push failed with
    #     denied: permission_denied: write_package
    # even after the repository's default workflow permission was changed to `write`. `contents:
    # read` is what `actions/checkout` needs, and a token minted without it cannot create a package.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Build OCI images
        run: |
          # TWO TAGS ON PURPOSE. The sha tag is the immutable record of what was built; `main` is
          # the moving tag a cluster can pull without editing manifests on every commit. The
          # Deployment asked for `v0.1.0`, which this workflow has never published, so the node
          # spent three and a half days reporting ImageInspectError against an image that did not
          # exist. A stable tag is what makes "the cluster runs main" true.
          for IMG in ironcage-kernel:Dockerfile.kernel ironcage-api:Dockerfile.api; do
            NAME="${IMG%%:*}"; FILE="${IMG##*:}"
            docker build -t "ghcr.io/chidionyema/$NAME:${{ github.sha }}" -t "ghcr.io/chidionyema/$NAME:main" -f "$FILE" .
          done
          docker images | grep ironcage
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        # A DISPATCH MUST PUBLISH TOO. The guard was `event_name == 'push'`, so a manually started
        # run built the images and threw them away -- the one route left open to a reader trying to
        # recover a broken publish was the one route that could not.
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/chidionyema/ironcage-kernel:${{ github.sha }}
          docker push ghcr.io/chidionyema/ironcage-api:${{ github.sha }}
          docker push ghcr.io/chidionyema/ironcage-kernel:main
          docker push ghcr.io/chidionyema/ironcage-api:main
          echo "✅ Images pushed to ghcr.io with sha: ${{ github.sha }}"
