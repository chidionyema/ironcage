name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --lib --verbose
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy -- -D warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Check binary sizes
        run: |
          ls -lh target/release/ironcage-*
          du -sh target/release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Build OCI images
        run: |
          docker build -t ironcage-kernel:v0.1.0 -f Dockerfile.kernel .
          docker build -t ironcage-api:v0.1.0 -f Dockerfile.api .
          docker images | grep ironcage
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: chidionyema
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push images to Docker Hub
        run: |
          docker tag ironcage-kernel:v0.1.0 docker.io/chidionyema/ironcage-kernel:v0.1.0
          docker tag ironcage-api:v0.1.0 docker.io/chidionyema/ironcage-api:v0.1.0
          docker push docker.io/chidionyema/ironcage-kernel:v0.1.0
          docker push docker.io/chidionyema/ironcage-api:v0.1.0
          echo "✅ Images pushed to docker.io"
