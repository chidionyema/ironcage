name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --lib --verbose
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy -- -D warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Check binary sizes
        run: |
          ls -lh target/release/ironcage-*
          du -sh target/release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Build OCI images
        run: |
          docker build -t ironcage-kernel:v0.1.0 -f Dockerfile.kernel .
          docker build -t ironcage-api:v0.1.0 -f Dockerfile.api .
          docker images | grep ironcage
      - name: Save images as OCI archives
        run: |
          mkdir -p oci-images
          docker save ironcage-kernel:v0.1.0 | gzip > oci-images/ironcage-kernel.tar.gz
          docker save ironcage-api:v0.1.0 | gzip > oci-images/ironcage-api.tar.gz
          ls -lh oci-images/
      - name: Upload OCI image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ironcage-oci-images
          path: oci-images/
          retention-days: 30
