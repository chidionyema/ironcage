name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --lib --verbose
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy -- -D warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Check binary sizes
        run: |
          ls -lh target/release/ironcage-*
          du -sh target/release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Create release tarball
        run: |
          mkdir -p release
          cp target/release/ironcage-kernel release/
          cp target/release/ironcage-api release/
          tar czf ironcage-release.tar.gz release/
          ls -lh ironcage-release.tar.gz
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ironcage-release
          path: ironcage-release.tar.gz
          retention-days: 30
